
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Kenya Location Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a class="logo" href="index.html">🇰🇪 Kenya Tracker</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main>
    <section class="panel auth-box">
        <div class="card-icon" style="text-align:center;">👤</div>

        <h1>Create Account</h1>
        <p class="auth-note">Join Kenya Location Tracker.</p>

        <form id="registerForm">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName"
                   placeholder="Enter your full name" required>

            <label for="registerEmail">Email Address</label>
            <input type="email" id="registerEmail"
                   placeholder="Enter your email" required>

            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword"
                   placeholder="Create a password"
                   minlength="8" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Confirm your password"
                   minlength="8" required>

            <button class="button" type="submit">
                Create Account
            </button>
        </form>

        <p id="registerMessage" class="message auth-note"
           aria-live="polite"></p>

        <p class="auth-note">
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>

        <p class="auth-note">
            <a href="index.html">← Back to Home</a>
        </p>
    </section>
</main>

<footer>
    © 2026 Kenya Location Tracker 🇰🇪
</footer>

<script src="auth.js"></script>
</body>
</html>
